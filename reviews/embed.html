<!doctype html>
<html lang="en-SG">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Aquamarine reviews</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="./carousel.css?v=1">
  <style>
    html, body { margin: 0; }
    #revu-embed { display: flow-root; overflow-wrap: anywhere; }
    /* The standalone badge is the one place for the overall rating. */
    #revu-embed .revwid-overall-rating { display: none; }
    @media (max-width: 1023px) {
      #revu-embed .revwid-review:not(.revwid-is-expanded) .revwid-for-expand,
      #revu-embed .revwid-review.revwid-is-expanded .revwid-for-collapse {
        display: inline-flex !important;
        min-height: 44px !important;
        align-items: center;
      }
      #revu-embed .revwid-pagination-link,
      #revu-embed .revwid-pagination-arrow { min-height: 44px; }
    }
  </style>
  <script src="./carousel.js?v=1" defer></script>
  <script src="./embed.js?v=3" defer></script>
<meta name="robots" content="noindex, nofollow">
</head>
<body>
  <div id="revu-embed"></div>
  <template id="revu-feed">
    <div data-bid="177473" data-url="https://app.revu.cloud"><script src="https://widget.reviewability.com/js/widgetAdv.min.js" async></script></div><script class="json-ld-content" type="application/ld+json"></script>
  </template>
  <template id="revu-badge">
    <div data-bid="177473" data-url="https://app.revu.cloud"><script src="https://widget.reviewability.com/js/badgeAdv.min.js" async></script></div><script class="json-ld-content" type="application/ld+json"></script>
  </template>
</body>
</html>
